# This repo's additions to the review exclude list. The installer joins these onto
# the fleet baseline when it renders .github/workflows/code-review.yml, so the
# baseline stays owned by the installer and this addition by the repo it governs.
# Editing the rendered workflow directly does not survive the next install.

# visual-tests/snapshots/** is committed capture output: each baseline is a frame a
# real terminal drew from a fixture the reviewer already reads, and nobody hand-edits
# one. Two review runs died reading 118 of them, the second at a compaction boundary
# of 195K input tokens. The .ansi files are the trap — few newlines and very long
# lines, so a diffstat reporting 4,096 insertions hides roughly 1 MB of escape bytes.
#
# The honest cost, stated because it is easy to overstate the safety here: Gate 4
# compares the .png and only the .png. The paired .ansi and .txt are checked by
# nothing — not the gate, and now not AI review either. They are regenerated whole
# from one capture rather than edited, so a wrong one means a wrong capture rather
# than a wrong line, and the .png beside it moves in the same commit.
#
# Scoped to this one path deliberately: a bare **/snapshots/** would hide any future
# directory that happened to be named snapshots from review entirely.
EXCLUDE_PATTERNS_EXTRA=visual-tests/snapshots/**
